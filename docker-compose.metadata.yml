services:
  mysql:
    image: mysql:8.0
    container_name: kickstarter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kickstarter7}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - kickstarter_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kickstarter_mysql_data:
